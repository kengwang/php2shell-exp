# Same pool settings as the `fpm` profile except for the limit the chain has to
# fill: memory_limit = 128M is PHP's own default, so this profile proves the FPM
# chain needs no shrunk limit.  upload_progress stays on with cleanup on, which
# is also the default handler behaviour.
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 20
max_input_vars = 1000
display_errors = Off
log_errors = On
error_log = /tmp/php-fpm-error.log
session.save_path = "/var/lib/php/sessions"
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.serialize_handler = php
