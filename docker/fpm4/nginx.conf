# Identical to docker/fpm/nginx.conf except that client_max_body_size is left
# out on purpose: every request of the fpm128 chain stays under nginx's built-in
# 1m limit, so the front-end needs no tuning.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log info;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/ngx-body;
    fastcgi_temp_path /tmp/ngx-fcgi;
    proxy_temp_path /tmp/ngx-proxy;

    server {
        listen 80;
        root /srv/www;
        index index.php;

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /srv/www$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /srv/www;
        }
    }
}
